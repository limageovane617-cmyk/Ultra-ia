name: Extrair zip
on:
  workflow_dispatch:
  push:
    paths:
      - "ultra-ia-projeto-v3.zip"
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o ultra-ia-projeto-v3.zip
          rm ultra-ia-projeto-v3.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Ultra IA: projeto extraido"
          git push
